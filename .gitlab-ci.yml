# Dasselbe für GitLab. Wer dort arbeitet, braucht nur diese Datei.
stages:
  - test
  - build

tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pytest -q

container:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -t gruppenkasse .
